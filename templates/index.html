<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Gusti</title>
    <!-- Manggil file CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Kerjaan Gusti Hari Ini</h1>
        
        <form action="/add" method="POST">
            <input type="text" name="task" placeholder="Mau ngerjain apa hari ini?" required>
            <button type="submit">Tambah</button>
        </form>

        <ul>
            <!-- Looping data dari Python pakai Jinja2 -->
            {% for i in range(tasks|length) %}
                <li>
                    {{ tasks[i] }}
                    <a href="/delete/{{ i }}" class="delete-btn">Selesai</a>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
